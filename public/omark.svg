<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TOPSYS IT O-mark">
  <!--
    O-mark: filled droplet, pointed top, round bottom, circular counter punched
    through with fill-rule: evenodd. Colour: teal #0E5A66.

    Outer path — teardrop
      top point (256, 25), cubic beziers meet the circle tangentially,
      then a full-radius arc closes the bottom.
    Inner path — circle
      concentric with the lower circle of the teardrop; creates the hole.
  -->
  <path
    fill="#0E5A66"
    fill-rule="evenodd"
    d="
      M 256 25
      C 376 95, 426 258, 426 340
      A 170 170 0 0 1 86 340
      C 86 258, 136 95, 256 25
      Z

      M 148 320
      A 108 108 0 0 1 364 320
      A 108 108 0 0 1 148 320
      Z
    "
  />
</svg>
